<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#05080f;stop-opacity:0" />
    </radialGradient>
    <style>
      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(10px, -20px) rotate(5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
      }
      .floating { animation: float 10s ease-in-out infinite; }
      .orbiting { animation: orbit 20s linear infinite; }
      .symbol { font-family: 'Inter', sans-serif; font-weight: bold; fill: #8b5cf6; opacity: 0.15; font-size: 24px; }
      .node { fill: #6366f1; opacity: 0.2; }
      .link { stroke: #6366f1; stroke-width: 0.5; opacity: 0.1; }
    </style>
  </defs>
  
  <!-- Subtle Background Nodes -->
  <circle cx="200" cy="200" r="150" fill="url(#grad)" class="floating" />
  <circle cx="800" cy="700" r="200" fill="url(#grad)" class="floating" style="animation-delay: -5s" />

  <!-- Abstract Connections -->
  <g class="floating">
    <circle cx="100" cy="150" r="3" class="node" />
    <circle cx="250" cy="100" r="3" class="node" />
    <circle cx="200" cy="300" r="3" class="node" />
    <line x1="100" y1="150" x2="250" y2="100" class="link" />
    <line x1="100" y1="150" x2="200" y2="300" class="link" />
    <line x1="250" y1="100" x2="200" y2="300" class="link" />
  </g>

  <!-- Mathematical Symbols -->
  <text x="150" y="450" class="symbol floating">\u2211</text>
  <text x="750" y="250" class="symbol floating" style="animation-delay: -2s">\u222B</text>
  <text x="850" y="550" class="symbol floating" style="animation-delay: -4s">\u03A9</text>
  <text x="350" y="850" class="symbol floating" style="animation-delay: -6s">\u221E</text>
  <text x="500" y="100" class="symbol floating" style="animation-delay: -8s">\u03C0</text>
  
  <!-- Orbiting Nodes -->
  <g transform="translate(500, 500)">
    <circle r="2" class="node orbiting" style="animation-duration: 15s" />
    <circle r="2" class="node orbiting" style="animation-duration: 25s; animation-delay: -10s" />
  </g>
</svg>
