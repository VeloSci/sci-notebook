<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagonal frame (family style) -->
  <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <!-- Open notebook pages -->
  <path d="M32 20 L20 22 L20 44 L32 42" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round" fill="none"/>
  <path d="M32 20 L44 22 L44 44 L32 42" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round" fill="none"/>
  <!-- Spine -->
  <line x1="32" y1="20" x2="32" y2="42" stroke="url(#logoGrad)" stroke-width="1.5"/>
  <!-- Writing lines (left page) -->
  <line x1="23" y1="27" x2="30" y2="26" stroke="url(#logoGrad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="23" y1="31" x2="30" y2="30" stroke="url(#logoGrad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="23" y1="35" x2="28" y2="34.5" stroke="url(#logoGrad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Formula on right page -->
  <text x="34" y="32" font-family="serif" font-size="10" font-weight="bold" fill="url(#logoGrad)" opacity="0.8">∑</text>
  <!-- Pen accent (top-right) -->
  <path d="M46 16 L50 12" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="12" r="1.5" fill="#a78bfa" filter="url(#glow)"/>
</svg>
