<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6; stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6366f1; stop-opacity:0.4"/>
    </linearGradient>
    
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6; stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b5cf6; stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#6366f1; stop-opacity:0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Hex Grid Pattern -->
    <pattern id="hexGrid" width="80" height="138.6" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M40 0 L80 23.1 L80 69.3 L40 92.4 L0 69.3 L0 23.1 Z" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    
    <style>
      @keyframes flow {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
        50% { transform: translateY(-30px) rotate(5deg); opacity: 0.3; }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
        50% { transform: translateY(30px) rotate(-5deg); opacity: 0.3; }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.1; }
        50% { transform: scale(1.1); opacity: 0.2; }
      }

      .flow-line {
        stroke-dasharray: 150 1050;
        animation: flow 12s linear infinite;
      }

      .symbol {
        font-family: 'Space Mono', monospace;
        font-weight: bold;
        transform-origin: center;
        transform-box: fill-box;
      }

      .float-1 { animation: float 10s ease-in-out infinite; }
      .float-2 { animation: floatReverse 12s ease-in-out infinite; }
      .float-3 { animation: float 15s ease-in-out infinite; }
      
      .pulse-node {
        transform-origin: center;
        transform-box: fill-box;
        animation: pulse 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Hex Grid -->
  <rect width="100%" height="100%" fill="url(#hexGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="300" fill="url(#brandGrad)" opacity="0.05" filter="url(#glow)" />
  <circle cx="1200" cy="700" r="400" fill="url(#brandGrad)" opacity="0.05" filter="url(#glow)" />

  <!-- Dynamic Data Streams -->
  <g stroke="url(#flowGrad)" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M-100,200 Q400,100 720,450 T1540,300" class="flow-line" style="animation-delay: 0s;"/>
    <path d="M-100,600 Q500,800 1000,400 T1540,700" class="flow-line" style="animation-delay: -4s; stroke-width: 3;"/>
    <path d="M300,-100 Q600,400 300,900" class="flow-line" style="animation-delay: -8s; opacity: 0.5;"/>
  </g>

  <!-- Notebook Symbols -->
  <g fill="#8b5cf6" font-size="120" class="symbol" filter="url(#softBlur)">
    <text x="100" y="300" class="float-1">{ }</text>
    <text x="1200" y="200" class="float-2">[ ]</text>
    <text x="1100" y="800" class="float-3">f(x)</text>
    <text x="50" y="800" class="float-2">&lt;/&gt;</text>
    <text x="600" y="100" class="float-1">∑</text>
    <text x="1300" y="500" class="float-3">∫</text>
  </g>

  <!-- Connection Nodes -->
  <g fill="#8b5cf6" filter="url(#glow)">
    <circle cx="400" cy="100" r="8" class="pulse-node" style="animation-delay: 0s;"/>
    <circle cx="720" cy="450" r="12" class="pulse-node" style="animation-duration: 6s;"/>
    <circle cx="1000" cy="700" r="10" class="pulse-node" style="animation-delay: -3s;"/>
  </g>

  <!-- Stylized Brackets (Library Identity) -->
  <g stroke="#8b5cf6" stroke-width="4" fill="none" opacity="0.1" filter="url(#glow)">
    <path d="M680 400 L660 400 L660 500 L680 500" />
    <path d="M760 400 L780 400 L780 500 L760 500" />
  </g>

</svg>
