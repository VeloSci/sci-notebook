<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pageBlur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- Ambient glow orbs -->
  <circle cx="250" cy="200" r="180" fill="url(#glow1)">
    <animate attributeName="r" values="180;200;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="400" r="220" fill="url(#glow2)">
    <animate attributeName="r" values="220;240;220" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="100" r="120" fill="url(#glow1)">
    <animate attributeName="cy" values="100;120;100" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Notebook page 1 (large, right side, tilted) -->
  <g transform="translate(820, 120) rotate(8)" opacity="0.12" filter="url(#pageBlur)">
    <rect width="180" height="240" rx="8" stroke="url(#g1)" stroke-width="2" fill="none"/>
    <!-- Ruled lines -->
    <line x1="20" y1="40" x2="160" y2="40" stroke="#8b5cf6" stroke-width="1.2"/>
    <line x1="20" y1="60" x2="160" y2="60" stroke="#8b5cf6" stroke-width="1.2"/>
    <line x1="20" y1="80" x2="140" y2="80" stroke="#8b5cf6" stroke-width="1.2"/>
    <line x1="20" y1="100" x2="155" y2="100" stroke="#8b5cf6" stroke-width="1.2"/>
    <line x1="20" y1="120" x2="120" y2="120" stroke="#8b5cf6" stroke-width="1.2"/>
    <!-- Code block area -->
    <rect x="20" y="140" width="140" height="50" rx="4" stroke="#6366f1" stroke-width="1" fill="#6366f1" fill-opacity="0.05"/>
    <line x1="28" y1="155" x2="80" y2="155" stroke="#6366f1" stroke-width="1"/>
    <line x1="28" y1="167" x2="100" y2="167" stroke="#6366f1" stroke-width="1"/>
    <line x1="28" y1="179" x2="70" y2="179" stroke="#6366f1" stroke-width="1"/>
    <!-- Margin line -->
    <line x1="14" y1="10" x2="14" y2="230" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Notebook page 2 (left side, tilted opposite) -->
  <g transform="translate(60, 300) rotate(-5)" opacity="0.09">
    <rect width="140" height="190" rx="6" stroke="url(#g1)" stroke-width="1.5" fill="none"/>
    <line x1="16" y1="30" x2="124" y2="30" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="16" y1="46" x2="124" y2="46" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="16" y1="62" x2="100" y2="62" stroke="#8b5cf6" stroke-width="1"/>
    <!-- Formula area -->
    <text x="40" y="100" font-family="serif" font-size="22" fill="#8b5cf6" opacity="0.6">∫ dx</text>
    <line x1="16" y1="120" x2="124" y2="120" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="16" y1="136" x2="90" y2="136" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="12" y1="8" x2="12" y2="182" stroke="#a78bfa" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Notebook page 3 (small, floating center-top) -->
  <g transform="translate(440, 40) rotate(3)" opacity="0.07">
    <rect width="100" height="130" rx="5" stroke="url(#g1)" stroke-width="1.2" fill="none"/>
    <line x1="12" y1="24" x2="88" y2="24" stroke="#8b5cf6" stroke-width="0.8"/>
    <line x1="12" y1="38" x2="88" y2="38" stroke="#8b5cf6" stroke-width="0.8"/>
    <line x1="12" y1="52" x2="70" y2="52" stroke="#8b5cf6" stroke-width="0.8"/>
    <!-- Table mini -->
    <rect x="12" y="65" width="76" height="40" rx="2" stroke="#6366f1" stroke-width="0.8" fill="none"/>
    <line x1="12" y1="78" x2="88" y2="78" stroke="#6366f1" stroke-width="0.6"/>
    <line x1="50" y1="65" x2="50" y2="105" stroke="#6366f1" stroke-width="0.6"/>
  </g>

  <!-- Floating mathematical symbols (unique to notebook theme) -->
  <g font-family="'Times New Roman', serif" font-weight="bold" fill="#8b5cf6">
    <text x="180" y="160" font-size="36" opacity="0.08">
      ∑
      <animate attributeName="y" values="160;148;160" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="520" font-size="30" opacity="0.06">
      ∫
      <animate attributeName="y" values="520;508;520" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="1050" y="500" font-size="28" opacity="0.07">
      ∂
      <animate attributeName="y" values="500;512;500" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="560" font-size="32" opacity="0.05">
      π
      <animate attributeName="y" values="560;548;560" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="350" y="80" font-size="26" opacity="0.06">
      ∞
      <animate attributeName="y" values="80;92;80" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="950" y="100" font-size="24" opacity="0.05">
      Ω
      <animate attributeName="y" values="100;88;100" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Connecting lines (notebook cell connections) -->
  <g stroke="url(#g1)" fill="none" opacity="0.06">
    <path d="M200 300 C300 280, 400 320, 500 290" stroke-width="1.5"/>
    <path d="M500 290 C600 260, 700 300, 800 270" stroke-width="1.5"/>
    <path d="M800 270 C900 240, 1000 280, 1100 250" stroke-width="1.5"/>
  </g>

  <!-- Cell-type indicator dots along connection -->
  <g filter="url(#softGlow)" opacity="0.5">
    <circle cx="200" cy="300" r="4" fill="#8b5cf6"/>
    <circle cx="500" cy="290" r="5" fill="#7c3aed"/>
    <circle cx="800" cy="270" r="6" fill="#6366f1"/>
    <circle cx="1100" cy="250" r="4" fill="#a78bfa"/>
  </g>

  <!-- Floating ink particles -->
  <g opacity="0.2">
    <circle cx="300" cy="450" r="2" fill="#8b5cf6">
      <animate attributeName="cy" values="450;430;450" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.35;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="200" r="2.5" fill="#6366f1">
      <animate attributeName="cy" values="200;215;200" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="480" r="1.8" fill="#a78bfa">
      <animate attributeName="cy" values="480;465;480" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="350" r="2.2" fill="#8b5cf6">
      <animate attributeName="cy" values="350;340;350" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="500" r="1.5" fill="#c4b5fd">
      <animate attributeName="cy" values="500;488;500" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="80" r="2" fill="#7c3aed">
      <animate attributeName="cy" values="80;95;80" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pen stroke accents -->
  <g stroke="url(#g2)" stroke-linecap="round" opacity="0.08">
    <path d="M100 550 Q200 540, 280 545" stroke-width="2"/>
    <path d="M900 560 Q1000 550, 1100 555" stroke-width="1.5"/>
    <path d="M400 580 Q500 570, 580 575" stroke-width="1"/>
  </g>
</svg>
