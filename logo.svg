<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="40" y="40" width="120" height="120" rx="20" fill="url(#grad1)" filter="url(#shadow)" />
  <!-- Notebook Lines -->
  <line x1="65" y1="75" x2="135" y2="75" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="65" y1="100" x2="135" y2="100" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="65" y1="125" x2="105" y2="125" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <!-- Sparkle/AI icon -->
  <path d="M145 60 L150 45 L155 60 L170 65 L155 70 L150 85 L145 70 L130 65 Z" fill="#00f2ff" />
</svg>
