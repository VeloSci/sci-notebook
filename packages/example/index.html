<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sci-Notebook — Examples</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .landing { max-width: 720px; padding: 40px 24px; text-align: center; }
      .landing h1 { font-size: 2rem; margin-bottom: 8px; }
      .landing p { color: #666; margin-bottom: 32px; font-size: 1.05rem; }
      .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 20px; background: #fff; border: 1px solid #dee2e6; border-radius: 12px; text-decoration: none; color: inherit; transition: all .15s; }
      .card:hover { border-color: #228be6; box-shadow: 0 4px 16px rgba(34,139,230,.12); transform: translateY(-2px); }
      .card-icon { font-size: 2rem; }
      .card-name { font-weight: 600; font-size: 1.1rem; }
      .card-badge { font-size: .75rem; padding: 2px 8px; border-radius: 99px; font-weight: 500; }
      .badge-react { background: #e3f2fd; color: #1976d2; }
      .badge-vue { background: #e8f5e9; color: #2e7d32; }
      .badge-svelte { background: #fff3e0; color: #e65100; }
      .badge-vanilla { background: #f3e5f5; color: #7b1fa2; }
    </style>
  </head>
  <body>
    <div class="landing">
      <h1>📓 Sci-Notebook Examples</h1>
      <p>Same notebook, same core engine — four framework adapters</p>
      <div class="cards">
        <a class="card" href="/sci-notebook/example/react/">
          <span class="card-icon">⚛️</span>
          <span class="card-name">React</span>
          <span class="card-badge badge-react">Primary</span>
        </a>
        <a class="card" href="/sci-notebook/example/vue/">
          <span class="card-icon">💚</span>
          <span class="card-name">Vue</span>
          <span class="card-badge badge-vue">Adapter</span>
        </a>
        <a class="card" href="/sci-notebook/example/svelte/">
          <span class="card-icon">🔥</span>
          <span class="card-name">Svelte</span>
          <span class="card-badge badge-svelte">Adapter</span>
        </a>
        <a class="card" href="/sci-notebook/example/vanilla/">
          <span class="card-icon">🟡</span>
          <span class="card-name">Vanilla JS</span>
          <span class="card-badge badge-vanilla">Adapter</span>
        </a>
      </div>
    </div>
  </body>
</html>
